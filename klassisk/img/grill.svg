<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" role="img" aria-label="Kulegrill">
  <defs>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <linearGradient id="dome" x1="0" x2="1">
      <stop offset="0" stop-color="#3a3632" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#3a3632" stop-opacity=".18"/>
      <stop offset="1" stop-color="#3a3632" stop-opacity=".42"/>
    </linearGradient>
  </defs>
  <g filter="url(#ink)" fill="none" stroke="#2b2724" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- smoke -->
    <path d="M92 46c-7-7 5-12-1-20s4-11 1-17" stroke-width="1.1" opacity=".55"/>
    <path d="M108 44c6-8-5-12 2-19s-3-10 1-16" stroke-width="1.1" opacity=".45"/>
    <!-- lid -->
    <path d="M48 96C49 60 75 52 100 52s51 8 52 44Z" fill="url(#dome)"/>
    <path d="M94 52v-5h12v5"/>
    <path d="M86 66c0-4 28-4 28 0" stroke-width="2.2"/>
    <path d="M60 84c3-14 12-21 22-24M66 90c2-10 8-16 15-19" stroke-width=".9" opacity=".6"/>
    <!-- rim -->
    <path d="M42 97c18 3 98 3 116 0" stroke-width="2.2"/>
    <!-- bowl -->
    <path d="M45 99c3 30 26 42 55 42s52-12 55-42" fill="#3a3632" fill-opacity=".62"/>
    <path d="M40 104h-7M160 104h7" stroke-width="2.4"/>
    <!-- legs -->
    <path d="M70 134L50 203M130 134l20 69M100 141v57"/>
    <path d="M62 172h76" stroke-width="1.2"/>
    <ellipse cx="100" cy="160" rx="14" ry="4" fill="#3a3632" fill-opacity=".35"/>
    <circle cx="50" cy="206" r="8" fill="#fff"/>
    <circle cx="50" cy="206" r="2"/>
    <path d="M150 203l4 6M100 198v8" stroke-width="2"/>
    <!-- ground -->
    <path d="M24 218c40-4 112-4 152 0" stroke-width="1" opacity=".35"/>
  </g>
</svg>
