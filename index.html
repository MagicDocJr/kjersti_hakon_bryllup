<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kjersti og Håkon, 25.–27. juni 2027</title>
    <!-- placeholder until the real site has the couple's photos and details -->
    <meta name="robots" content="noindex" />
    <meta name="description" content="Kjersti og Håkon gifter seg helgen 25.–27. juni 2027 på Malungen gjestegård. Sett av datoen – nettside med registrering og mer informasjon kommer snart." />
    <meta name="theme-color" content="#0b1030" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kjersti og Håkon gifter seg" />
    <meta property="og:description" content="Sett av helgen 25.–27. juni 2027. Nettside med registrering og mer informasjon kommer snart." />
    <meta property="og:url" content="https://www.kjerstioghakon.no/" />
    <meta property="og:image" content="https://www.kjerstioghakon.no/assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="nb_NO" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Hanken+Grotesk:wght@400;500&family=Pinyon+Script&display=swap" />
    <link rel="modulepreload" href="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.186.1/three.module.min.js" crossorigin />
    <style>
        /* Save the date. A midsummer night: the countdown is made of light,
           everything around it stays quiet. */
        :root {
            --night: #0b1030;
            --night-2: #131b46;
            --ivory: #f3efe6;
            --ivory-soft: rgba(243, 239, 230, 0.68);
            --cornflower: #8ea5ff;
            --line: rgba(243, 239, 230, 0.16);
            --f-display: 'Bodoni Moda', 'Didot', Georgia, serif;
            --f-text: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
            --f-script: 'Pinyon Script', 'Snell Roundhand', cursive;
            color-scheme: dark;
        }
        *, *::before, *::after { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: max(28px, env(safe-area-inset-top, 0px)) 20px max(28px, env(safe-area-inset-bottom, 0px));
            /* the sky never goes fully dark in late June: a low glow on the horizon */
            background:
                radial-gradient(90% 38% at 50% 108%, rgba(242, 185, 143, 0.22), rgba(242, 185, 143, 0) 70%),
                radial-gradient(70% 50% at 50% 0%, rgba(80, 104, 214, 0.18), rgba(80, 104, 214, 0) 70%),
                linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
            background-attachment: fixed;
            color: var(--ivory);
            font-family: var(--f-text);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            text-align: center;
        }
        p, h1, dl, dd { margin: 0; }
        a { color: inherit; }
        :focus-visible { outline: 2px solid var(--cornflower); outline-offset: 3px; }

        main { width: min(1000px, 100%); display: grid; justify-items: center; }

        .kicker { font-family: var(--f-display); font-style: italic; font-size: clamp(16px, 2vw, 19px); color: var(--ivory-soft); }

        h1 {
            margin-top: 14px;
            font-family: var(--f-display);
            font-variation-settings: "opsz" 30;
            font-weight: 450;
            font-size: clamp(48px, 7.2vw, 88px);
            line-height: 0.95;
            letter-spacing: -0.025em;
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 0.16em;
        }
        h1 .amp { font-family: var(--f-script); font-variation-settings: normal; color: var(--cornflower); font-size: 0.82em; letter-spacing: 0; }

        .when { margin-top: 18px; font-family: var(--f-display); font-variation-settings: "opsz" 24; font-weight: 500; font-size: clamp(19px, 2.4vw, 24px); }
        .where { margin-top: 2px; color: var(--ivory-soft); }

        /* the two threads live on a full-screen canvas behind everything */
        .threads { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: block; }
        main { position: relative; z-index: 1; }
        h1, .when, .count { text-shadow: 0 0 40px rgba(11, 16, 48, 0.85), 0 0 12px rgba(11, 16, 48, 0.6); }

        .count {
            margin-top: clamp(30px, 6vh, 64px);
            display: grid;
            justify-items: center;
            font-variant-numeric: lining-nums tabular-nums;
        }
        .days {
            font-family: var(--f-display);
            font-variation-settings: "opsz" 30;
            font-weight: 400;
            font-size: clamp(96px, 17vw, 196px);
            line-height: 0.85;
            letter-spacing: -0.03em;
        }
        .days-wrap { display: grid; justify-items: center; padding: 0 0.4em; }
        /* when the ring closes, the number warms to gold */
        .days { transition: color 1.6s, text-shadow 1.6s; }
        /* words ("I dag", "Gift!") sit smaller than numbers */
        .days.word { font-size: clamp(64px, 11vw, 128px); line-height: 1; font-style: italic; }
        .clock { transition: margin-top 1.6s cubic-bezier(.16, .8, .2, 1); }
        .count { transition: padding-bottom 1.6s cubic-bezier(.16, .8, .2, 1); }
        .count.tied .clock { margin-top: 66px; }
        .count.tied { padding-bottom: 34px; }
        .count.tied .days { color: #fff3dc; text-shadow: 0 0 36px rgba(236, 200, 140, 0.55), 0 0 90px rgba(236, 200, 140, 0.3); }
        .days-label { margin-top: 6px; font-family: var(--f-display); font-style: italic; font-size: clamp(19px, 2.4vw, 24px); }
        .clock { margin-top: 18px; display: flex; gap: 28px; justify-content: center; color: var(--ivory-soft); }
        /* the digit windows have no text baseline, so align bottoms and lift the label to the numerals' baseline */
        .clock > span { display: inline-flex; align-items: flex-end; gap: 6px; }
        .clock b { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 3.8vw, 38px); color: var(--ivory); display: inline-flex; margin-bottom: -0.17em; }
        /* odometer digits: each sits in its own window and rolls when it changes */
        .dg {
            position: relative;
            display: inline-block;
            width: 0.62em;
            height: 1.2em;
            overflow: hidden;
            text-align: center;
            -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 24%, #000 76%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 24%, #000 76%, transparent 100%);
        }
        .dg > span { position: absolute; inset: 0; line-height: 1.2em; will-change: transform; }
        /* a slow cross-fade when a number changes */
        .swap { animation: swap 1.6s cubic-bezier(.16, .8, .2, 1); }
        @keyframes swap { 0% { opacity: 0.15; filter: blur(8px); } 100% { opacity: 1; filter: blur(0); } }


        .until { margin-top: 14px; font-size: 14px; color: var(--ivory-soft); }
        .soon { margin-top: 30px; max-width: 30ch; font-family: var(--f-display); font-style: italic; font-size: clamp(20px, 2.6vw, 26px); line-height: 1.35; text-wrap: balance; }

        .cal { margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 999px;
            border: 1px solid rgba(243, 239, 230, 0.55);
            font-weight: 500;
            font-size: 15px;
            text-decoration: none;
            transition: background .2s, color .2s, border-color .2s;
        }
        .btn-solid { background: var(--ivory); color: var(--night); border-color: var(--ivory); }
        .btn-solid:hover { background: #fff; }
        .btn:not(.btn-solid):hover { background: rgba(243, 239, 230, 0.1); border-color: var(--ivory); }

        footer { margin-top: 34px; font-size: 13px; color: var(--ivory-soft); letter-spacing: 0.04em; }

        .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

        /* the entrance is a sequence: names, then the light rises, then the details */
        @media (prefers-reduced-motion: no-preference) {
            .kicker, h1, .when, .where, .count, .until, .soon, .cal, footer { animation: rise 2.2s cubic-bezier(.16, .8, .2, 1) both; }
            .threads { animation: fade 4s ease both .6s; }
            .kicker { animation-delay: .2s; }
            h1 { animation-delay: .5s; }
            .when, .where { animation-delay: 1.1s; }
            .count, .until { animation-delay: 1.8s; }
            .soon, .cal, footer { animation-delay: 3s; }
            @keyframes rise { from { opacity: 0; transform: translateY(16px); filter: blur(4px); } }
            @keyframes fade { from { opacity: 0; } }
        }

        @media (max-width: 600px) {
            h1 { flex-direction: column; align-items: center; gap: 0; font-size: clamp(52px, 16vw, 76px); }
            h1 .amp { font-size: 0.6em; line-height: 1; }
            .clock { gap: 16px; font-size: 14px; }
            .clock b { font-size: 26px; }
        }
    </style>
</head>
<body>
<canvas class="threads" id="threads" aria-hidden="true"></canvas>
<main>
    <p class="kicker">Sett av datoen</p>
    <h1><span>Kjersti</span> <span class="amp" aria-label="og">&amp;</span> <span>Håkon</span></h1>
    <p class="when">25.–27. juni 2027</p>
    <p class="where">Malungen gjestegård, Vallset</p>

    <div class="count" aria-hidden="true">
        <span class="days-wrap">
            <span class="days" id="c-d">–</span>
            <span class="days-label" id="c-dl">dager</span>
        </span>
        <span class="clock"><span><b id="c-h"></b>timer</span><span><b id="c-m"></b>minutter</span><span><b id="c-s"></b>sekunder</span></span>
    </div>
    <p class="until" id="until">til vielsen lørdag 26. juni kl. 13.00</p>
    <p class="sr" id="sr-count" aria-live="off"></p>

    <p class="soon" id="soon">Nettside med registrering og mer informasjon kommer snart</p>

    <div class="cal">
        <a class="btn btn-solid" href="/assets/kjersti-og-hakon.ics" download="kjersti-og-hakon.ics">Legg til i kalenderen</a>
        <a class="btn" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Kjersti+og+H%C3%A5kon+gifter+seg&amp;dates=20270625/20270628&amp;location=Malungen+gjesteg%C3%A5rd%2C+Odalsvegen+1601%2C+2330+Vallset&amp;details=Invitasjon+og+svarskjema+kommer+p%C3%A5+https%3A%2F%2Fwww.kjerstioghakon.no" target="_blank" rel="noopener">Google Kalender</a>
    </div>

    <footer>kjerstioghakon.no</footer>
</main>

<script>
    // Countdown in plain type. Numbers cross-fade when they change.
    // ?now=2027-06-26T10:00 previews the page at another moment (for testing).
    window.KH_CLOCK = (() => {
        const q = new URLSearchParams(location.search).get('now');
        const off = q && !isNaN(Date.parse(q)) ? Date.parse(q) - Date.now() : 0;
        return () => Date.now() + off;
    })();
    (function () {
        const WEDDING = new Date('2027-06-26T13:00:00+02:00').getTime();
        const $ = (id) => document.getElementById(id);
        const el = { d: $('c-d'), dl: $('c-dl'), h: $('c-h'), m: $('c-m'), s: $('c-s') };
        const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const EASE = 'cubic-bezier(.22, .8, .2, 1)';
        // roll each changed digit: the old one slides up and blurs away, the new one glides in
        function roll(node, text) {
            while (node.children.length < text.length) {
                const box = document.createElement('span');
                box.className = 'dg';
                box.appendChild(document.createElement('span'));
                node.appendChild(box);
            }
            [...node.children].forEach((box, i) => {
                const ch = text[i];
                if (box.dataset.v === ch) return;
                const first = box.dataset.v === undefined;
                box.dataset.v = ch;
                const next = document.createElement('span');
                next.textContent = ch;
                const prev = box.lastElementChild;
                box.appendChild(next);
                if (first || still) { prev.remove(); return; }
                const opts = { duration: 820, easing: EASE, fill: 'forwards' };
                prev.animate([{ transform: 'translateY(0)', opacity: 1, filter: 'blur(0)' }, { transform: 'translateY(-90%)', opacity: 0, filter: 'blur(3px)' }], opts).finished.then(() => prev.remove());
                next.animate([{ transform: 'translateY(90%)', opacity: 0, filter: 'blur(3px)' }, { transform: 'translateY(0)', opacity: 1, filter: 'blur(0)' }], opts);
            });
        }
        const clockRow = document.querySelector('.clock');
        const sr = $('sr-count');
        const two = (n) => String(n).padStart(2, '0');
        const set = (node, text) => {
            if (node.textContent === text) return;
            node.textContent = text;
            node.classList.remove('swap'); void node.offsetWidth; node.classList.add('swap');
        };
        let mode = '';
        function tick() {
            const now = window.KH_CLOCK();
            let ms = WEDDING - now;
            if (ms <= 0) {
                if (mode === 'after') return;
                mode = 'after';
                set(el.d, 'Gift!'); el.d.classList.add('word'); el.dl.textContent = '26. juni 2027';
                clockRow.hidden = true; $('until').hidden = true;
                $('soon').textContent = 'Takk for at dere feiret med oss!';
                document.querySelector('.cal').hidden = true;
                sr.textContent = 'Kjersti og Håkon er gift.';
                return;
            }
            const d = Math.floor(ms / 86400000); ms -= d * 86400000;
            const h = Math.floor(ms / 3600000); ms -= h * 3600000;
            const m = Math.floor(ms / 60000);
            const sameDay = new Date(now).toLocaleDateString('nb-NO', { timeZone: 'Europe/Oslo' }) === new Date(WEDDING).toLocaleDateString('nb-NO', { timeZone: 'Europe/Oslo' });
            el.d.classList.toggle('word', sameDay);
            if (sameDay) { set(el.d, 'I dag'); el.dl.textContent = 'vielsen er kl. 13.00'; }
            else { set(el.d, String(d)); el.dl.textContent = d === 1 ? 'dag' : 'dager'; }
            const sec = Math.floor((ms - m * 60000) / 1000);
            roll(el.h, two(h)); roll(el.m, two(m)); roll(el.s, two(sec));
            sr.textContent = `${d} dager, ${h} timer og ${m} minutter igjen.`;
        }
        // tick right on the second, so the roll lands in time with the clock
        (function loop() { tick(); setTimeout(loop, 1000 - (window.KH_CLOCK() % 1000) + 5); })();
    })();
</script>
<script type="module">
    const canvas = document.getElementById('threads');
    const gl = (() => { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch { return false; } })();
    if (!gl) canvas.remove();
    else {
        const count = document.querySelector('.count');
        import('/assets/threads.js?v=10').then(({ startThreads }) => {
            startThreads(canvas, {
                reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
                ringAround: document.querySelector('.days-wrap'),
                clock: window.KH_CLOCK,
                onFrame(p, knot) { count.classList.toggle('tied', knot > 0.85); },
            });
        }).catch((err) => { console.error(err); canvas.remove(); });
    }
</script>
</body>
</html>
