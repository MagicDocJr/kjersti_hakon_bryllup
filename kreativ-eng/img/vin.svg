<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 270" role="img" aria-label="Glass med hvitvin">
  <defs>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <filter id="wash" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
    <linearGradient id="wine" x1="0" x2="1">
      <stop offset="0" stop-color="#e3cf7d"/>
      <stop offset=".4" stop-color="#f3e7b2"/>
      <stop offset="1" stop-color="#d8bf62"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="88" cy="252" rx="52" ry="7" fill="#8fa3bd" opacity=".22" filter="url(#wash)"/>
  <!-- wine body -->
  <path d="M45 92c2 30 14 48 35 50 21-2 33-20 35-50Z" fill="url(#wine)" opacity=".85" filter="url(#wash)"/>
  <ellipse cx="80" cy="92" rx="35" ry="5" fill="#f7efc9"/>
  <g filter="url(#ink)" fill="none" stroke="#2b2724" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="80" cy="28" rx="34" ry="5.5"/>
    <path d="M46 28c-6 52 1 108 34 116 33-8 40-64 34-116"/>
    <path d="M45 92c8 4 62 4 70 0" stroke-width="1" opacity=".7"/>
    <path d="M77.5 144c.5 30 .5 60-1 88M82.5 144c-.5 30-.5 60 1 88"/>
    <path d="M76.5 232c-12 2-34 6-34 12 0 5 16 8 37.5 8s37.5-3 37.5-8c0-6-22-10-34-12"/>
    <path d="M44 244c4 4 20 6 36 6" stroke-width=".9" opacity=".5"/>
  </g>
  <!-- highlights -->
  <path d="M55 40c-3 26-1 54 8 76" stroke="#fff" stroke-width="3.2" stroke-linecap="round" fill="none" opacity=".9"/>
  <path d="M104 46c1 14 0 26-3 38" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".75"/>
  <path d="M79 160v60" stroke="#fff" stroke-width="1.2" opacity=".8"/>
</svg>
