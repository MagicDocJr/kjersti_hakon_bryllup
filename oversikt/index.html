<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gjesteoversikt · Kjersti og Håkon</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500;600&display=swap" />
    <style>
        /* Private overview for the couple. Reads kh_responses as the logged-in
           kjerstioghakon@gmail.com user; RLS lets only that address SELECT,
           and change the paid columns. */
        :root {
            --paper: #f3efe6;
            --card: #fbf9f4;
            --ink: #1c2347;
            --ink-soft: #4b5170;
            --line: rgba(28, 35, 71, 0.16);
            --cornflower: #3651c9;
            --yes: #2f6b45;
            --no: #a63f2b;
            --f-display: 'Bodoni Moda', 'Didot', Georgia, serif;
            --f-text: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
            color-scheme: light;
        }
        *, *::before, *::after { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-text); -webkit-font-smoothing: antialiased; }
        a { color: var(--cornflower); }
        .wrap { width: min(1200px, 100%); margin-inline: auto; padding: 32px 20px 64px; }
        header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
        header svg { width: 40px; height: 43px; flex: none; }
        h1 { margin: 0; font: 400 clamp(26px, 3vw, 34px)/1.1 var(--f-display); }
        header .who { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--ink-soft); }
        .live { display: inline-flex; align-items: center; gap: 6px; }
        .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #b9b4a8; }
        .live.on::before { background: #3aa365; box-shadow: 0 0 0 3px rgba(58, 163, 101, 0.18); }
        button, .btn { font: 500 14px var(--f-text); padding: 9px 16px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 999px; cursor: pointer; text-decoration: none; }
        button.ghost { background: transparent; color: var(--ink); }
        button:disabled { opacity: 0.5; cursor: default; }

        /* login */
        .login { max-width: 380px; margin: 12vh auto 0; background: var(--card); border: 1px solid var(--line); padding: 32px 28px; border-radius: 6px; }
        .login svg { display: block; width: 56px; height: 60px; margin: 0 auto 14px; }
        .login h1 { text-align: center; margin-bottom: 22px; }
        .login label { display: block; font-size: 13px; font-weight: 500; margin: 14px 0 6px; }
        .login input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
        .login button { width: 100%; margin-top: 20px; }
        .err { color: var(--no); font-size: 14px; margin: 12px 0 0; }

        /* numbers */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 28px; }
        .stat { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
        .stat b { display: block; font: 400 34px/1.1 var(--f-display); font-variant-numeric: lining-nums tabular-nums; }
        .stat span { font-size: 13px; color: var(--ink-soft); }
        .stat small { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-soft); }

        .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
        .tools input[type="search"] { flex: 1 1 220px; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
        .tools select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
        .tools .count { font-size: 13px; color: var(--ink-soft); }

        .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
        th { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; position: sticky; top: 0; background: var(--card); }
        tr.hh-start td { border-top: 2px solid var(--line); }
        td.name { font-weight: 500; white-space: nowrap; }
        td.when { white-space: nowrap; color: var(--ink-soft); font-size: 13px; }
        td.msg { max-width: 32ch; color: var(--ink-soft); }
        .y { color: var(--yes); font-weight: 500; }
        .n { color: var(--no); font-weight: 500; }
        .dash { color: #b9b4a8; }
        tr.fresh td { animation: fresh 3s ease-out; }
        @keyframes fresh { from { background: #fff3c8; } to { background: transparent; } }
        .empty { padding: 40px; text-align: center; color: var(--ink-soft); }

        /* paid: a button for anyone staying over */
        .paid-btn { font: inherit; padding: 2px 8px; margin: -2px -8px; border: 1px solid transparent; background: none; color: inherit; border-radius: 999px; cursor: pointer; }
        .paid-btn:hover { border-color: var(--line); background: #fff; }
        .checked { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }

        /* confirm dialog */
        dialog { width: min(420px, calc(100% - 32px)); border: 1px solid var(--line); border-radius: 8px; padding: 24px 22px 20px; color: var(--ink); background: var(--card); }
        dialog::backdrop { background: rgba(28, 35, 71, 0.3); }
        dialog h2 { margin: 0 0 6px; font: 400 24px var(--f-display); }
        dialog p { margin: 0; color: var(--ink-soft); }
        .who-list { list-style: none; margin: 14px 0 6px; padding: 0; border-top: 1px solid var(--line); }
        .who-list li { border-bottom: 1px solid var(--line); }
        .who-list label { display: flex; align-items: center; gap: 10px; padding: 10px 2px; cursor: pointer; }
        .who-list input { width: 18px; height: 18px; accent-color: var(--ink); }
        .who-list .now { margin-left: auto; font-size: 13px; }
        .sum { margin-top: 8px !important; color: var(--ink) !important; }
        .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
        .dialog-err { color: var(--no) !important; margin-top: 8px !important; font-size: 14px; }

        .diet { margin-top: 28px; }
        .diet h2 { font: 400 22px var(--f-display); margin: 0 0 10px; }
        .diet ul { margin: 0; padding-left: 18px; columns: 2 280px; }
        @media (max-width: 640px) { header .who { margin-left: 0; width: 100%; } }
    </style>
</head>
<body>
    <form class="login" id="login" hidden>
        <svg viewBox="0 0 355 378" aria-hidden="true"><use href="../assets/monogram.svg#kh" /></svg>
        <h1>Gjesteoversikt</h1>
        <label for="email">E-post</label>
        <input id="email" type="email" autocomplete="username" value="kjerstioghakon@gmail.com" required />
        <label for="password">Passord</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button type="submit" id="login-btn">Logg inn</button>
        <p class="err" id="login-err" role="alert" hidden></p>
    </form>

    <div class="wrap" id="app" hidden>
        <header>
            <svg viewBox="0 0 355 378" aria-hidden="true"><use href="../assets/monogram.svg#kh" /></svg>
            <h1>Gjesteoversikt</h1>
            <div class="who">
                <span class="live" id="live">Kobler til…</span>
                <button class="ghost" id="csv" type="button">Last ned CSV</button>
                <button class="ghost" id="logout" type="button">Logg ut</button>
            </div>
        </header>

        <section class="stats" id="stats" aria-label="Tall"></section>

        <div class="tools">
            <input type="search" id="q" placeholder="Søk etter navn, e-post, allergi…" aria-label="Søk" />
            <select id="filter" aria-label="Vis">
                <option value="all">Alle</option>
                <option value="coming">Kommer</option>
                <option value="not">Kommer ikke</option>
                <option value="stay">Overnatter</option>
                <option value="unpaid">Overnatter, ikke betalt</option>
                <option value="diet">Har allergier</option>
            </select>
            <span class="count" id="count"></span>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Navn</th><th>Kommer</th><th>Overnatter</th><th>Betalt</th><th>Allergier og mat</th><th>Kommentar</th><th>E-post</th><th>Svart</th></tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
            <p class="empty" id="empty" hidden>Ingen svar ennå.</p>
        </div>

        <section class="diet" id="diet" hidden>
            <h2>Allergier og matpreferanser</h2>
            <ul id="diet-list"></ul>
        </section>
    </div>

    <dialog id="pay-dialog" aria-labelledby="pay-title">
        <form method="dialog" id="pay-form">
            <h2 id="pay-title"></h2>
            <p id="pay-text"></p>
            <ul class="who-list" id="pay-who"></ul>
            <p class="sum" id="pay-sum"></p>
            <p class="dialog-err" id="pay-err" role="alert" hidden></p>
            <div class="dialog-actions">
                <button type="button" class="ghost" id="pay-cancel">Avbryt</button>
                <button type="submit" id="pay-ok"></button>
            </div>
        </form>
    </dialog>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

    // Same project and public key as the RSVP form. The key alone can only
    // insert; reading needs the couple's login (see supabase/kh_responses.sql).
    const SUPABASE_URL = 'https://bevrttmvumfodpkauiio.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJldnJ0dG12dW1mb2Rwa2F1aWlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA2MTE4NjksImV4cCI6MjA2NjE4Nzg2OX0.DEZl36UgcM_KOlnbVlxfIdW_ZRdmkAMbbdHfF3KLCyk';
    const PRICE_PER_PERSON = 1600;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storageKey: 'kh-oversikt' } });

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const kr = (n) => `${n.toLocaleString('nb-NO')} kr`;
    const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
    let rows = [];
    let fresh = new Set();
    let channel = null;
    let started = false;

    /* ---------- auth ---------- */
    $('login').addEventListener('submit', async (e) => {
        e.preventDefault();
        $('login-btn').disabled = true;
        $('login-err').hidden = true;
        const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
        $('login-btn').disabled = false;
        if (error) { $('login-err').textContent = 'Feil e-post eller passord.'; $('login-err').hidden = false; }
    });
    $('logout').addEventListener('click', () => sb.auth.signOut());

    sb.auth.onAuthStateChange((_event, session) => {
        $('login').hidden = !!session;
        $('app').hidden = !session;
        // supabase-js deadlocks if its own calls are awaited inside this callback
        setTimeout(() => (session ? start() : stop()));
    });

    /* ---------- data ---------- */
    async function start() {
        if (started) return;
        started = true;
        if (!(await refresh())) { started = false; return; }
        // new replies stream in as they are sent
        channel = sb.channel('kh-responses')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'kh_responses' }, (msg) => {
                if (msg.eventType === 'INSERT') { rows.unshift(msg.new); fresh.add(msg.new.id); }
                else if (msg.eventType === 'UPDATE') rows = rows.map((r) => (r.id === msg.new.id ? msg.new : r));
                else if (msg.eventType === 'DELETE') rows = rows.filter((r) => r.id !== msg.old.id);
                render();
                fresh = new Set();
            })
            .subscribe((status) => {
                const on = status === 'SUBSCRIBED';
                $('live').classList.toggle('on', on);
                $('live').textContent = on ? 'Live' : 'Kobler til…';
                // the live feed takes a few seconds to start after connecting
                // (and after every reconnect), so catch up on anything sent meanwhile
                if (on) setTimeout(refresh, 5000);
            });
    }
    async function refresh() {
        const { data, error } = await sb.from('kh_responses').select('*').order('created_at', { ascending: false });
        if (error) { console.error(error); $('live').textContent = 'Kunne ikke hente svar'; return false; }
        rows = data;
        render();
        return true;
    }
    // a laptop that slept or a phone tab in the background can miss events
    document.addEventListener('visibilitychange', () => { if (!document.hidden && started) refresh(); });
    function stop() {
        if (channel) sb.removeChannel(channel);
        channel = null;
        started = false;
        rows = [];
    }

    /* ---------- render ---------- */
    const yn = (v) => (v === true ? '<span class="y">Ja</span>' : v === false ? '<span class="n">Nei</span>' : '<span class="dash">–</span>');
    const when = (iso) => new Date(iso).toLocaleString('nb-NO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    const paidCell = (r) => `<button type="button" class="paid-btn" data-paid="${esc(r.id)}" title="Endre betalt">${yn(r.paid_lodging === true)}</button>${r.paid_checked_at ? ' <span class="checked" title="Endret av dere">✓ sjekket</span>' : ''}`;

    function matches(r, q, f) {
        if (f === 'coming' && !r.attending) return false;
        if (f === 'not' && r.attending) return false;
        if (f === 'stay' && !r.stay) return false;
        if (f === 'unpaid' && !(r.stay && r.paid_lodging !== true)) return false;
        if (f === 'diet' && !r.allergies) return false;
        if (!q) return true;
        return [r.first_name, r.last_name, r.email, r.allergies, r.message].join(' ').toLowerCase().includes(q);
    }

    function render() {
        const coming = rows.filter((r) => r.attending);
        const staying = coming.filter((r) => r.stay);
        const paid = staying.filter((r) => r.paid_lodging === true);
        const households = new Set(rows.map((r) => r.household_id)).size;
        const stat = (n, label, sub = '') => `<div class="stat"><b>${n}</b><span>${label}</span>${sub ? `<small>${sub}</small>` : ''}</div>`;
        $('stats').innerHTML = [
            stat(coming.length, 'kommer', `av ${rows.length} gjester i ${households} svar`),
            stat(rows.length - coming.length, 'kommer ikke'),
            stat(staying.length, 'overnatter', kr(staying.length * PRICE_PER_PERSON)),
            stat(paid.length, 'har betalt', staying.length - paid.length ? `${staying.length - paid.length} har ikke betalt ennå` : ''),
            stat(coming.filter((r) => r.allergies).length, 'med allergier'),
        ].join('');

        const q = $('q').value.trim().toLowerCase();
        const f = $('filter').value;
        const shown = rows.filter((r) => matches(r, q, f));
        $('count').textContent = shown.length === rows.length ? `${rows.length} gjester` : `${shown.length} av ${rows.length} gjester`;
        $('empty').hidden = rows.length > 0;
        let prevHh = null;
        $('rows').innerHTML = shown.map((r) => {
            const start = r.household_id !== prevHh;
            prevHh = r.household_id;
            const cls = [start ? 'hh-start' : '', fresh.has(r.id) ? 'fresh' : ''].join(' ').trim();
            return `<tr class="${cls}">
                <td class="name">${esc(r.first_name)} ${esc(r.last_name)}</td>
                <td>${yn(r.attending)}</td>
                <td>${r.attending ? yn(r.stay) : yn(null)}</td>
                <td>${r.stay ? paidCell(r) : yn(null)}</td>
                <td>${esc(r.allergies) || '<span class="dash">–</span>'}</td>
                <td class="msg">${esc(r.message)}</td>
                <td>${start && r.email ? `<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>` : ''}</td>
                <td class="when">${start ? when(r.created_at) : ''}</td>
            </tr>`;
        }).join('');

        const diet = coming.filter((r) => r.allergies);
        $('diet').hidden = diet.length === 0;
        $('diet-list').innerHTML = diet.map((r) => `<li><b>${esc(r.first_name)} ${esc(r.last_name)}:</b> ${esc(r.allergies)}</li>`).join('');
    }
    $('q').addEventListener('input', render);
    $('filter').addEventListener('change', render);

    /* ---------- correcting who has paid ----------
       Clicking a guest's "Betalt" opens a confirmation. One transfer often
       covers a whole reply, so everyone else in it who is staying over is
       listed too, ticked where the change applies. */
    const dialog = $('pay-dialog');
    let payMark = null;
    $('rows').addEventListener('click', (e) => {
        const b = e.target.closest('[data-paid]');
        if (!b) return;
        const r = rows.find((x) => x.id === b.dataset.paid);
        if (!r) return;
        payMark = r.paid_lodging !== true;
        const fam = rows.filter((x) => x.household_id === r.household_id && x.stay && x.id !== r.id);
        const name = (x) => `${esc(x.first_name)} ${esc(x.last_name)}`;
        $('pay-title').textContent = payMark ? 'Marker som betalt?' : 'Marker som ikke betalt?';
        $('pay-text').textContent = fam.length ? `Huk av alle i dette svaret som ${payMark ? 'har betalt' : 'ikke har betalt'}.` : 'Sjekk at overføringen gjelder riktig person.';
        $('pay-who').innerHTML = [r, ...fam].map((x) => `<li><label><input type="checkbox" value="${esc(x.id)}" ${x.id === r.id || (x.paid_lodging === true) !== payMark ? 'checked' : ''} /> ${name(x)} <span class="now">${yn(x.paid_lodging === true)}</span></label></li>`).join('');
        const sum = () => {
            const n = $('pay-who').querySelectorAll('input:checked').length;
            $('pay-sum').textContent = n ? `${plural(n, 'person', 'personer')} · ${kr(n * PRICE_PER_PERSON)}` : 'Ingen valgt';
            $('pay-ok').disabled = n === 0;
            $('pay-ok').textContent = payMark ? 'Ja, har betalt' : 'Ja, ikke betalt';
        };
        $('pay-who').onchange = sum;
        $('pay-err').hidden = true;
        sum();
        dialog.showModal();
    });
    $('pay-cancel').addEventListener('click', () => dialog.close());
    $('pay-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const ids = [...$('pay-who').querySelectorAll('input:checked')].map((i) => i.value);
        if (!ids.length || payMark === null) return;
        $('pay-ok').disabled = true;
        const { data, error } = await sb.from('kh_responses')
            .update({ paid_lodging: payMark, paid_checked_at: new Date().toISOString() })
            .in('id', ids).select('id, paid_lodging, paid_checked_at');
        $('pay-ok').disabled = false;
        if (error || !data || data.length !== ids.length) {
            console.error(error);
            $('pay-err').textContent = 'Kunne ikke lagre. Prøv igjen, eller last siden på nytt.';
            $('pay-err').hidden = false;
            return;
        }
        for (const u of data) rows = rows.map((r) => (r.id === u.id ? { ...r, ...u } : r));
        dialog.close();
        render();
    });

    /* ---------- CSV for Excel ---------- */
    $('csv').addEventListener('click', () => {
        const cols = ['first_name', 'last_name', 'attending', 'stay', 'paid_lodging', 'allergies', 'message', 'email', 'created_at', 'household_id'];
        const head = ['Fornavn', 'Etternavn', 'Kommer', 'Overnatter', 'Betalt', 'Allergier', 'Kommentar', 'E-post', 'Svart', 'Husstand'];
        const cell = (v) => {
            const s = v === true ? 'Ja' : v === false ? 'Nei' : String(v ?? '');
            return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
        };
        const csv = '﻿' + [head, ...rows.map((r) => cols.map((c) => r[c]))].map((line) => line.map(cell).join(';')).join('\r\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        a.download = `gjester-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
    });
</script>
</body>
</html>
